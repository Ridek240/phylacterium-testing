name: Publish Unity Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify build
        shell: bash
        run: |
          test -d game
          test -n "$(find game -type f -print -quit)"

      - name: Build detected
        run: echo "New Unity build detected!"